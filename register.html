<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Analyst Registration &mdash; AegisDNS Network Protection System</title>
  
  <link rel="icon" type="image/svg+xml" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 24 24' fill='%2300f0ff'><path d='M12 1L3 5v6c0 5.55 3.84 10.74 9 12 5.16-1.26 9-6.45 9-12V5l-9-4zm0 10.99h7c-.53 4.12-3.28 7.79-7 8.94V12H5V6.3l7-3.11v8.8z'/></svg>">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
  
  <link rel="stylesheet" href="css/cyber-theme.css">
  <link rel="stylesheet" href="css/components.css">
</head>
<body class="auth-page">

  <div class="auth-container">
    <div class="auth-card">
      <div class="scan-line"></div>

      <!-- Auth Header -->
      <div class="auth-header">
        <a href="index.html" class="d-inline-block text-decoration-none">
          <div class="auth-logo">
            <i class="fa-solid fa-user-shield"></i>
          </div>
        </a>
        <h2 class="auth-title">Create SecOps Profile</h2>
        <p class="auth-subtitle">Register for AegisDNS Network Protection Console</p>
      </div>

      <!-- Error Alert Box -->
      <div id="regAlert" class="alert alert-danger" style="display: none; background: rgba(255, 51, 102, 0.12); border-color: var(--color-malicious-border); color: #ff3366; font-size: 0.85rem;" role="alert"></div>

      <!-- Registration Form -->
      <form id="registerForm" novalidate>
        
        <!-- Full Name -->
        <div class="mb-3">
          <label for="regFullName" class="form-label text-dim" style="font-size: 0.82rem; text-transform: uppercase; font-weight: 600;">
            Full Legal Name
          </label>
          <div class="input-group input-group-cyber">
            <span class="input-group-text"><i class="fa-solid fa-id-card"></i></span>
            <input type="text" class="form-control form-control-cyber" id="regFullName" placeholder="e.g. Alex Mercer" required autocomplete="name">
          </div>
        </div>

        <!-- Email Address -->
        <div class="mb-3">
          <label for="regEmail" class="form-label text-dim" style="font-size: 0.82rem; text-transform: uppercase; font-weight: 600;">
            Security Analyst Email
          </label>
          <div class="input-group input-group-cyber">
            <span class="input-group-text"><i class="fa-solid fa-envelope"></i></span>
            <input type="email" class="form-control form-control-cyber" id="regEmail" placeholder="analyst@enterprise-domain.local" required autocomplete="email">
          </div>
        </div>

        <!-- Username -->
        <div class="mb-3">
          <label for="regUsername" class="form-label text-dim" style="font-size: 0.82rem; text-transform: uppercase; font-weight: 600;">
            System Username
          </label>
          <div class="input-group input-group-cyber">
            <span class="input-group-text"><i class="fa-solid fa-at"></i></span>
            <input type="text" class="form-control form-control-cyber font-mono" id="regUsername" placeholder="secops_alex" required autocomplete="username">
          </div>
        </div>

        <!-- Password -->
        <div class="mb-3">
          <label for="regPassword" class="form-label text-dim" style="font-size: 0.82rem; text-transform: uppercase; font-weight: 600;">
            Master Password
          </label>
          <div class="input-group input-group-cyber">
            <span class="input-group-text"><i class="fa-solid fa-lock"></i></span>
            <input type="password" class="form-control form-control-cyber" id="regPassword" placeholder="Min. 8 chars with symbols" required autocomplete="new-password">
            <button class="btn btn-cyber-secondary toggle-password-btn" type="button" data-target="regPassword" title="Show/Hide Password">
              <i class="fa-solid fa-eye"></i>
            </button>
          </div>
          <!-- Live Strength Meter -->
          <div class="password-strength-bar">
            <div id="passwordStrengthFill" class="password-strength-fill"></div>
          </div>
          <div id="passwordStrengthText" class="text-dim mt-1" style="font-size: 0.72rem;">Enter at least 8 characters</div>
        </div>

        <!-- Confirm Password -->
        <div class="mb-3">
          <label for="regConfirmPassword" class="form-label text-dim" style="font-size: 0.82rem; text-transform: uppercase; font-weight: 600;">
            Confirm Password
          </label>
          <div class="input-group input-group-cyber">
            <span class="input-group-text"><i class="fa-solid fa-shield-halved"></i></span>
            <input type="password" class="form-control form-control-cyber" id="regConfirmPassword" placeholder="Repeat your password" required autocomplete="new-password">
            <button class="btn btn-cyber-secondary toggle-password-btn" type="button" data-target="regConfirmPassword" title="Show/Hide Password">
              <i class="fa-solid fa-eye"></i>
            </button>
          </div>
        </div>

        <!-- Terms checkbox -->
        <div class="form-check mb-4">
          <input class="form-check-input" type="checkbox" id="regTerms" required style="background-color: rgba(148, 163, 184, 0.2); border-color: rgba(148, 163, 184, 0.3);">
          <label class="form-check-label text-muted" for="regTerms" style="font-size: 0.82rem;">
            I agree to the <span class="text-cyan">AegisDNS Network Protection Policy</span> and authorization protocols.
          </label>
        </div>

        <button type="submit" id="regSubmitBtn" class="btn-cyber-primary w-100 justify-content-center" style="padding: 0.75rem 1rem;">
          Complete Registration <i class="fa-solid fa-user-shield ms-1"></i>
        </button>

        <div class="text-center mt-4" style="font-size: 0.875rem;">
          <span class="text-muted">Already have a SecOps account?</span>
          <a href="login.html" class="text-cyan text-decoration-none fw-semibold ms-1">Sign In</a>
        </div>

        <div class="text-center mt-3">
          <a href="index.html" class="text-dim text-decoration-none" style="font-size: 0.8rem;">
            <i class="fa-solid fa-arrow-left me-1"></i> Return to Homepage
          </a>
        </div>
      </form>
    </div>
  </div>

  <!-- Scripts -->
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
  <script src="js/mock-data.js"></script>
  <script src="js/api-service.js"></script>
  <script src="js/cyber-ui.js"></script>
  <script src="js/auth.js"></script>
</body>
</html>
