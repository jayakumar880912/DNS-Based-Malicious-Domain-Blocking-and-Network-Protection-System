<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Sign In &mdash; AegisDNS Network Protection System</title>
  
  <link rel="icon" type="image/svg+xml" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 24 24' fill='%2300f0ff'><path d='M12 1L3 5v6c0 5.55 3.84 10.74 9 12 5.16-1.26 9-6.45 9-12V5l-9-4zm0 10.99h7c-.53 4.12-3.28 7.79-7 8.94V12H5V6.3l7-3.11v8.8z'/></svg>">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
  
  <link rel="stylesheet" href="css/cyber-theme.css">
  <link rel="stylesheet" href="css/components.css">
</head>
<body class="auth-page">

  <div class="auth-container">
    <div class="auth-card">
      <div class="scan-line"></div>

      <!-- Auth Header -->
      <div class="auth-header">
        <a href="index.html" class="d-inline-block text-decoration-none">
          <div class="auth-logo">
            <i class="fa-solid fa-shield-halved"></i>
          </div>
        </a>
        <h2 class="auth-title">SecOps Console Sign In</h2>
        <p class="auth-subtitle">AegisDNS Malicious Domain Blocking System</p>
      </div>

      <!-- Error Alert Box -->
      <div id="loginAlert" class="alert alert-danger" style="display: none; background: rgba(255, 51, 102, 0.12); border-color: var(--color-malicious-border); color: #ff3366; font-size: 0.85rem;" role="alert"></div>

      <!-- Login Form -->
      <form id="loginForm" novalidate>
        <div class="mb-3">
          <label for="loginIdentifier" class="form-label text-dim" style="font-size: 0.82rem; text-transform: uppercase; font-weight: 600;">
            Email Address or Username
          </label>
          <div class="input-group input-group-cyber">
            <span class="input-group-text"><i class="fa-solid fa-user-shield"></i></span>
            <input type="text" class="form-control form-control-cyber" id="loginIdentifier" placeholder="admin@aegisdns.security" required autocomplete="username">
          </div>
        </div>

        <div class="mb-3">
          <div class="d-flex justify-content-between align-items-center mb-1">
            <label for="loginPassword" class="form-label text-dim mb-0" style="font-size: 0.82rem; text-transform: uppercase; font-weight: 600;">
              Console Password
            </label>
            <a href="#" onclick="CyberUI.showToast('Please contact your Security Administrator to reset MFA / credentials.', 'info'); return false;" class="text-cyan text-decoration-none" style="font-size: 0.78rem;">
              Forgot Password?
            </a>
          </div>
          <div class="input-group input-group-cyber">
            <span class="input-group-text"><i class="fa-solid fa-key"></i></span>
            <input type="password" class="form-control form-control-cyber" id="loginPassword" placeholder="Enter secure password" required autocomplete="current-password">
            <button class="btn btn-cyber-secondary toggle-password-btn" type="button" data-target="loginPassword" title="Show/Hide Password">
              <i class="fa-solid fa-eye"></i>
            </button>
          </div>
        </div>

        <div class="d-flex align-items-center justify-content-between mb-4">
          <div class="form-check">
            <input class="form-check-input" type="checkbox" id="loginRemember" style="background-color: rgba(148, 163, 184, 0.2); border-color: rgba(148, 163, 184, 0.3);">
            <label class="form-check-label text-muted" for="loginRemember" style="font-size: 0.85rem;">
              Remember this workstation
            </label>
          </div>
        </div>

        <button type="submit" id="loginSubmitBtn" class="btn-cyber-primary w-100 justify-content-center" style="padding: 0.75rem 1rem;">
          Sign In to Console <i class="fa-solid fa-arrow-right ms-1"></i>
        </button>

        <!-- Quick Demo Account Fill Button -->
        <div class="auth-demo-box">
          <div class="text-dim mb-1 font-mono" style="font-size: 0.75rem;">FRONTEND DEMONSTRATION MODE</div>
          <button type="button" id="btnDemoCredentials" class="btn-cyber-secondary btn-cyber-sm w-100 justify-content-center">
            <i class="fa-solid fa-bolt"></i> Auto-fill SecOps Demo Credentials
          </button>
        </div>

        <div class="text-center mt-4" style="font-size: 0.875rem;">
          <span class="text-muted">Need a security analyst account?</span>
          <a href="register.html" class="text-cyan text-decoration-none fw-semibold ms-1">Register here</a>
        </div>

        <div class="text-center mt-3">
          <a href="index.html" class="text-dim text-decoration-none" style="font-size: 0.8rem;">
            <i class="fa-solid fa-arrow-left me-1"></i> Return to Homepage
          </a>
        </div>
      </form>
    </div>
  </div>

  <!-- Scripts -->
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
  <script src="js/mock-data.js"></script>
  <script src="js/api-service.js"></script>
  <script src="js/cyber-ui.js"></script>
  <script src="js/auth.js"></script>
</body>
</html>
